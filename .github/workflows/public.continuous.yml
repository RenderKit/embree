name: continuous (public)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  clang-tidy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packages (ubuntu 24.04)
        run: |
          apt-get update
          apt-get -y install clang-tidy cmake ninja-build

      - name: Configure compilation database
        run: |
          cmake -S . -B build-tidy -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DEMBREE_TASKING_SYSTEM=INTERNAL \
            -DEMBREE_TUTORIALS=OFF \
            -DBUILD_TESTING=OFF \
            -DEMBREE_ISPC_SUPPORT=OFF

      - name: Run clang-tidy on PR changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          source_patterns=(':(glob)**/*.c' ':(glob)**/*.cc' ':(glob)**/*.cpp' ':(glob)**/*.cxx')
          header_patterns=(':(glob)**/*.h' ':(glob)**/*.hh' ':(glob)**/*.hpp' ':(glob)**/*.hxx')

          if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "${header_patterns[@]}"; then
            mapfile -t files < <(
              sed -n 's|.*"file": "\([^"]*\)".*|\1|p' build-tidy/compile_commands.json |
                sort -u
            )
          else
            mapfile -d '' -t files < <(
              git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- "${source_patterns[@]}"
            )
          fi

          if ((${#files[@]})); then
            clang-tidy -p build-tidy -header-filter='^(common|kernels|include)/' "${files[@]}"
          fi

  rocky-8:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:8
    steps:
      - name: Install packages (rocky 8)
        run: |
          yum -y install epel-release
          yum -y install gcc-c++ clang tar git-lfs make tbb-devel freeglut-devel glfw-devel libXmu-devel libXi-devel python3
          yum -y install cmake
          yum -y install libXcursor-devel libXi-devel libXinerama-devel libXrandr-devel
          yum -y install ncurses-compat-libs 
          yum -y install environment-modules
          dnf makecache --refresh
          dnf config-manager --set-enabled powertools
          dnf -y update
          dnf -y install ninja-build

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Run
        run: |
          mkdir build
          cd build
          cmake -DBUILD_TESTING=ON -DEMBREE_TUTORIALS=ON -DEMBREE_ISPC_SUPPORT=OFF -DEMBREE_TESTING_INTENSITY=3 ..
          make -j$(nproc)
          ctest

  ubuntu-24-tbb-and-ispc-from-os:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: Install packages (ubuntu 24.04)
        run: |
          apt-get update
          apt-get -y upgrade
          apt-get -y install g++ cmake git-lfs freeglut3-dev libglfw3-dev libxmu-dev libxi-dev unzip xorg-dev pip libtbb-dev ispc
          apt-get -y install libopenimageio-dev

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Run
        run: |
          mkdir build
          cd build
          cmake -DBUILD_TESTING=ON -DEMBREE_TUTORIALS=ON -DEMBREE_ISPC_SUPPORT=ON -DEMBREE_TESTING_INTENSITY=3 ..
          make -j$(nproc)
          ctest

  ubuntu-24-tbb-and-ispc-prebuilt:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: Install packages (ubuntu 24.04)
        run: |
          apt-get update
          apt-get -y upgrade
          apt-get -y install g++ cmake git-lfs freeglut3-dev libglfw3-dev libxmu-dev libxi-dev unzip xorg-dev pip
          apt-get -y install libopenimageio-dev

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Run
        run: |
          mkdir build
          cd build
          cmake -D EMBREE_EXTRA_OPTIONS="-DBUILD_TESTING=ON -DEMBREE_TUTORIALS=ON -DEMBREE_ISPC_SUPPORT=ON -DEMBREE_TESTING_INTENSITY=3" ../superbuild
          cmake --build .
          cd embree/build
          ctest

  ubuntu-24-tbb-src-ispc-prebuilt:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: Install packages (ubuntu 24.04)
        run: |
          apt-get update
          apt-get -y upgrade
          apt-get -y install g++ cmake git-lfs freeglut3-dev libglfw3-dev libxmu-dev libxi-dev unzip xorg-dev pip
          apt-get -y install libopenimageio-dev

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Run
        run: |
          mkdir build
          cd build
          cmake -D BUILD_TBB_FROM_SOURCE=ON -D EMBREE_EXTRA_OPTIONS="-DBUILD_TESTING=ON -DEMBREE_TUTORIALS=ON -DEMBREE_ISPC_SUPPORT=ON -DEMBREE_TESTING_INTENSITY=3" ../superbuild
          cmake --build .
          cd embree/build
          ctest

  windows-11-arm:
    runs-on: windows-11-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Run
        shell: pwsh
        run: |
          $opts  = "-DBUILD_TESTING=ON"
          $opts += " -DEMBREE_TUTORIALS=ON"
          $opts += " -DEMBREE_ISPC_SUPPORT=OFF"
          $opts += " -DEMBREE_TASKING_SYSTEM=INTERNAL"
          $opts += " -DEMBREE_TESTING_INTENSITY=2"

          cmake -B build -G "Visual Studio 17 2022" -A ARM64 $opts.Split(" ") .
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure

  windows-11:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Run
        shell: pwsh
        run: |
          $opts  = "-DBUILD_TESTING=ON"
          $opts += " -DEMBREE_TUTORIALS=ON"
          $opts += " -DEMBREE_ISPC_SUPPORT=OFF"
          $opts += " -DEMBREE_TASKING_SYSTEM=INTERNAL"
          $opts += " -DEMBREE_TESTING_INTENSITY=2"

          cmake -B build -G "Visual Studio 17 2022" $opts.Split(" ") .
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure

  macos-26:
    runs-on: macos-26
    steps:
      - name: Install packages (macOS 26)
        run: |
          brew update
          brew install cmake git-lfs freeglut glfw tbb

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Run
        run: |
          mkdir build
          cd build
          cmake -DBUILD_TESTING=ON -DEMBREE_TUTORIALS=ON -DEMBREE_ISPC_SUPPORT=OFF -DEMBREE_TESTING_INTENSITY=3 ..
          make -j$(sysctl -n hw.ncpu)
          ctest --test-dir . -C Release --output-on-failure

  macos-26-intel:
    runs-on: macos-26-intel
    steps:
      - name: Install packages (macOS 26)
        run: |
          brew update
          brew install cmake git-lfs freeglut glfw tbb

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Run
        run: |
          mkdir build
          cd build
          cmake -DBUILD_TESTING=ON -DEMBREE_TUTORIALS=ON -DEMBREE_ISPC_SUPPORT=OFF -DEMBREE_TESTING_INTENSITY=3 ..
          make -j$(sysctl -n hw.ncpu)
          ctest --test-dir . -C Release --output-on-failure
